name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # フレームワーク単体の検査。
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # データベースを入れた状態でも通ることを確かめる。
      - run: cargo clippy --workspace --all-targets --features "sqlite encryption" -- -D warnings
      - run: cargo test --workspace --features "sqlite encryption"
      # ドライバ・メール・WebSocket・Argon2id・テンプレートを全部入れた状態。
      # TLS（rustls + ring）のビルドに C コンパイラが要るので、3つの OS で確かめる。
      - run: cargo clippy --workspace --all-targets --features "sqlite mysql postgres mail encryption websocket argon2 view" -- -D warnings
      - run: cargo test --workspace --features "sqlite mysql postgres mail encryption websocket argon2 view"
      # 機能フラグを外しても通ることを確かめる。
      - run: cargo clippy -p bengara --no-default-features --all-targets -- -D warnings

  # 機能フラグを1つずつ入れた状態。組み合わせの取りこぼしを防ぐ。
  features:
    name: features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [ sqlite, mysql, mariadb, postgres, mail, encryption, websocket, argon2, view ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p bengara --no-default-features --all-targets --features ${{ matrix.feature }} -- -D warnings
      - run: cargo test -p bengara --no-default-features --features ${{ matrix.feature }}

  # 本物の MySQL と PostgreSQL につないで確かめる。
  # 接続先の環境変数が無いときは、ドライバのテストは何もしません。
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: bengara
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bengara
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bengara
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BENGARA_TEST_MYSQL_URL: mysql://root:secret@127.0.0.1:3306/bengara
      BENGARA_TEST_POSTGRES_URL: postgres://bengara:secret@127.0.0.1:5432/bengara
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bengara --features "mysql postgres"

  # 対応する一番古い Rust 版（Cargo.toml の rust-version）で通ることを確かめる。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "sqlite mysql postgres mail encryption websocket argon2 view"

  # 利用者の手順をそのまま再現する。
  # cargo new → init → build → test が通ること。
  user-flow:
    name: user-flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bengara
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo new してフレームワークを手元のソースに差し替える
        shell: bash
        run: |
          cargo new myapp
          cd myapp
          # cargo new の Cargo.toml は [dependencies] で終わるので、そこへ追記する。
          # 公開前なので、crates.io ではなく手元のソースを使う。
          printf 'bengara = { version = "0.1", features = ["sqlite"] }\n\n' >> Cargo.toml
          printf '[patch.crates-io]\n' >> Cargo.toml
          printf 'bengara = { path = "../bengara/crates/bengara" }\n' >> Cargo.toml
          printf 'bengara-build = { path = "../bengara/crates/bengara-build" }\n' >> Cargo.toml
          printf 'bengara-macros = { path = "../bengara/crates/bengara-macros" }\n' >> Cargo.toml
          printf 'fn main() { bengara::run() }\n' > src/main.rs
      - name: init してビルドとテスト
        shell: bash
        working-directory: myapp
        run: |
          cargo run -- init
          cargo build
          cargo test
          cargo run -- route:list
          cargo run -- migrate
          cargo run -- migrate:status
          cargo run -- db:seed
          # 周辺機能のコマンドも、雛形のまま動くこと。
          cargo run -- cache:clear
          cargo run -- schedule:list
          cargo run -- schedule:run
          cargo run -- lang:list
          # 本番の置き方のコマンドも、雛形のまま動くこと。
          cargo run -- storage:init
          cargo run -- about
      - name: リリースビルドで public/ が埋め込まれる
        shell: bash
        working-directory: myapp
        run: |
          cargo build --release
          # 生成されたコードに include_bytes! が入っていること。
          # init は public/robots.txt を作るので、必ず1件以上ある。
          # 置き場所は Cargo の版で違う（myapp-<英数字>/out/ と myapp/<英数字>/out/）ので、
          # パスは決め打ちせずにファイル名で探す。
          if ! grep -rq --include=bengara_app.rs "include_bytes!" target/release/build; then
            echo "public/ が埋め込まれていません"
            exit 1
          fi
          echo "public/ が埋め込まれました"
