name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # フレームワーク単体の検査。
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # データベースを入れた状態でも通ることを確かめる。
      - run: cargo clippy --workspace --all-targets --features "sqlite encryption" -- -D warnings
      - run: cargo test --workspace --features "sqlite encryption"
      # 機能フラグを外しても通ることを確かめる。
      - run: cargo clippy -p bengara --no-default-features --all-targets -- -D warnings

  # 対応する一番古い Rust 版（Cargo.toml の rust-version）で通ることを確かめる。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "sqlite encryption"

  # 利用者の手順をそのまま再現する。
  # cargo new → init → build → test が通ること。
  user-flow:
    name: user-flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bengara
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo new してフレームワークを手元のソースに差し替える
        shell: bash
        run: |
          cargo new myapp
          cd myapp
          # cargo new の Cargo.toml は [dependencies] で終わるので、そこへ追記する。
          # 公開前なので、crates.io ではなく手元のソースを使う。
          printf 'bengara = { version = "0.1", features = ["sqlite"] }\n\n' >> Cargo.toml
          printf '[patch.crates-io]\n' >> Cargo.toml
          printf 'bengara = { path = "../bengara/crates/bengara" }\n' >> Cargo.toml
          printf 'bengara-build = { path = "../bengara/crates/bengara-build" }\n' >> Cargo.toml
          printf 'bengara-macros = { path = "../bengara/crates/bengara-macros" }\n' >> Cargo.toml
          printf 'fn main() { bengara::run() }\n' > src/main.rs
      - name: init してビルドとテスト
        shell: bash
        working-directory: myapp
        run: |
          cargo run -- init
          cargo build
          cargo test
          cargo run -- route:list
          cargo run -- migrate
          cargo run -- migrate:status
          cargo run -- db:seed
          # 周辺機能のコマンドも、雛形のまま動くこと。
          cargo run -- cache:clear
          cargo run -- schedule:list
          cargo run -- schedule:run
          cargo run -- lang:list
          # 本番の置き方のコマンドも、雛形のまま動くこと。
          cargo run -- storage:init
          cargo run -- about
      - name: リリースビルドで public/ が埋め込まれる
        shell: bash
        working-directory: myapp
        run: |
          cargo build --release
          # 生成されたコードに include_bytes! が入っていること。
          # init は public/robots.txt を作るので、必ず1件以上ある。
          if ! grep -rq "include_bytes!" target/release/build/myapp-*/out/bengara_app.rs; then
            echo "public/ が埋め込まれていません"
            exit 1
          fi
          echo "public/ が埋め込まれました"

  # アプリ側（bengara-sandbox）が壊れていないことを確かめる。
  # フレームワークだけを変えたときの巻き込み事故を防ぐため。
  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bengara-rs/bengara-sandbox
          path: sandbox
          # bengara-sandbox が非公開なら、読み取り権限のある SANDBOX_TOKEN を登録する。
          # 公開なら登録不要で、既定のトークンで取得できる。
          token: ${{ secrets.SANDBOX_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          # 変更中の bengara を、サブモジュールの位置に置く。
          path: sandbox/bengara
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
        working-directory: sandbox
